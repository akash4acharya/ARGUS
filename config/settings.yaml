# ARGUS CCTV Speed & Telemetry Configuration

camera:
  id: 1
  name: "Campus Main Road - Camera 01"
  # Accepts an RTSP stream (e.g. "rtsp://admin:pass@192.168.1.100:554/h264"),
  # an HTTP MJPEG stream, local camera index (0), or a local video path ("sample_traffic.mp4")
  source: "data/demo/highway_expressway.mp4"
  width: 1280
  height: 720
  speed_limit_kmh: 50.0

calibration:
  # 4-point quadrilateral on road plane in pixel coordinates:
  # P1: Top-Left, P2: Top-Right, P3: Bottom-Right, P4: Bottom-Left
  src_points:
    - [705.0, 260.0]
    - [1140.0, 260.0]
    - [1255.0, 680.0]
    - [655.0, 680.0]
  # Corresponding real-world metric dimensions of the calibrated rectangle
  real_width_m: 10.5    # Metric width of 3 highway lanes (3 x 3.5m)
  real_length_m: 28.0   # Metric longitudinal distance of the trap (~2.5 highway dash cycles)

detector:
  model_weights: "models/argus_detrac_yolov8n.pt"
  confidence_threshold: 0.40
  iou_threshold: 0.45
  # UA-DETRAC class IDs: 0 (car/van), 1 (bus), 2 (others)
  classes: [0, 1, 2]
  device: "0"

tracker:
  max_age: 30
  n_init: 3
  nms_max_overlap: 1.0
  max_cosine_distance: 0.3
  nn_budget: 100
  use_embedder: false   # Fast IOU tracking maintains 25-40 FPS on dense multi-lane highways

database:
  url: "postgresql+asyncpg://postgres:postgres@localhost:5432/cctv_speed_db"
  # Automatic fallback to local SQLite database if PostgreSQL connection fails
  sqlite_fallback: true
  sqlite_url: "sqlite+aiosqlite:///cctv_speed_local.db"

storage:
  evidence_dir: "evidence_crops"

server:
  host: "0.0.0.0"
  port: 8000
